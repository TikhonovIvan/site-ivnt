    <main class="container mt-5">

        <div class="card shadow border-0">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Добавление нового Монитора</h4>
            </div>

            <div class="card-body">

                <form>

                    <div class="row">

                        <!-- Инвентарный номер -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Инвентарный №
                            </label>

                            <input type="text" class="form-control" placeholder="Например PC-001">
                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Внутренний инвентарный код
                            </label>

                            <input type="text" id="pcCode" class="form-control" readonly>

                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Инвентарный № ПК
                            </label>

                            <input type="text" class="form-control" placeholder="Например PC-002">
                        </div>

                        <!-- Материнская плата -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Модель
                            </label>

                            <input type="text" class="form-control" placeholder="Asus 3124">
                        </div>

                        <!-- Процессор -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Диагональ
                            </label>

                            <input type="text" class="form-control" placeholder="24">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Выходы
                            </label>

                            <select class="form-select">

                                <option selected>
                                    VGA,
                                </option>

                                <option>
                                    VGA, HDIM
                                </option>

                                <option>
                                    VGA, DVI
                                </option>

                                <option>
                                    HDIM, DVI
                                </option>

                            </select>
                        </div>

                        <!-- Состояние -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Состояние
                            </label>

                            <select class="form-select">

                                <option selected>
                                    Выберите состояние устройство
                                </option>

                                <option>
                                    Рабочее
                                </option>

                                <option>
                                    Нерабочее
                                </option>

                            </select>
                        </div>

                        <!-- Отдел -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Отделение
                            </label>

                            <select class="form-select">

                                <option selected>
                                    Выберите отдел
                                </option>

                                <option>
                                    Бухгалтерия
                                </option>

                                <option>
                                    IT отдел
                                </option>

                                <option>
                                    Отдел кадров
                                </option>

                            </select>
                        </div>

                        <!-- Кабинет -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Кабинет
                            </label>

                            <input type="text" class="form-control" placeholder="203">
                        </div>

                        <!-- Примечание -->
                        <div class="col-12 mb-3">

                            <label class="form-label">
                                Примечание
                            </label>

                            <textarea class="form-control" rows="3"></textarea>

                        </div>

                    </div>

                    <div class="d-flex justify-content-end gap-3">

                        <button type="reset" class="btn btn-secondary">
                            Очистить
                        </button>

                        <button type="submit" class="btn btn-success">
                            Сохранить
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </main>


    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
