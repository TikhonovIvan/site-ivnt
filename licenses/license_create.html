    <main class="container mt-4">
      <form>
        <div class="card shadow">
          <div class="card-header bg-success text-white">Создание лицензии</div>

          <div class="card-body">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label>Организация</label>

                <input type="text" class="form-control" />
              </div>

              <div class="col-md-6 mb-3">
                <label>Тип лицензии</label>

                <select class="form-select">
                  <option>1 месяц</option>
                  <option>3 месяца</option>
                  <option>6 месяцев</option>
                  <option>12 месяцев</option>
                </select>
              </div>

              <div class="col-md-6 mb-3">
                <label>Количество пользователей</label>

                <input type="number" class="form-control" value="50" />
              </div>

              <div class="col-md-6 mb-3">
                <label>Количество устройств</label>

                <input type="number" class="form-control" value="500" />
              </div>

              <div class="col-md-6 mb-3">
                <label>Дата начала</label>

                <input type="date" class="form-control" />
              </div>

              <div class="col-md-6 mb-3">
                <label>Дата окончания</label>

                <input type="date" class="form-control" />
              </div>

              <div class="col-12 mb-3">
                <label>Примечание</label>

                <textarea class="form-control" rows="3"></textarea>
              </div>
            </div>

            <button class="btn btn-success">Создать лицензию</button>
          </div>
        </div>
      </form>
