<!doctype html>

<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Выдача лицензии пользователю</title>

    ```
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    ```
  </head>
  <body>
    <div class="container mt-5">
      ```
      <div class="card shadow border-0">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Выдача лицензии пользователю</h4>
        </div>

        <div class="card-body">
          <form>
            <div class="row">
              <!-- Пользователь -->
              <div class="col-md-6 mb-3">
                <label class="form-label"> Пользователь </label>

                <select class="form-select">
                  <option selected disabled>Выберите пользователя</option>

                  <option>Иванов Иван Иванович (doctor)</option>

                  <option>Петров Петр Петрович (doctor)</option>

                  <option>Сидоров Сергей (admin)</option>
                </select>
              </div>

              <!-- Тип лицензии -->
              <div class="col-md-6 mb-3">
                <label class="form-label"> Тип лицензии </label>

                <select class="form-select">
                  <option selected disabled>Выберите тип лицензии</option>

                  <option>Doctor Standard</option>
                  <option>Doctor Pro</option>
                  <option>Administrator</option>
                  <option>Operator</option>
                </select>
              </div>

              <!-- Срок -->
              <div class="col-md-6 mb-3">
                <label class="form-label"> Период действия </label>

                <select class="form-select">
                  <option>1 месяц</option>
                  <option>3 месяца</option>
                  <option>6 месяцев</option>
                  <option>12 месяцев</option>
                </select>
              </div>

              <!-- Дата начала -->
              <div class="col-md-6 mb-3">
                <label class="form-label"> Дата начала </label>

                <input type="date" class="form-control" />
              </div>

              <!-- Дата окончания -->
              <div class="col-md-6 mb-3">
                <label class="form-label"> Дата окончания </label>

                <input type="date" class="form-control" />
              </div>

              <!-- Статус -->
              <div class="col-md-6 mb-3">
                <label class="form-label"> Статус лицензии </label>

                <select class="form-select">
                  <option>Активна</option>
                  <option>Приостановлена</option>
                  <option>Отозвана</option>
                </select>
              </div>

              <!-- Доступ к функционалу -->
              <div class="col-12 mb-3">
                <label class="form-label"> Разрешенный функционал </label>

                <div class="row">
                  <div class="col-md-4">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" checked />
                      <label class="form-check-label">
                        Просмотр оборудования
                      </label>
                    </div>
                  </div>

                  <div class="col-md-4">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" checked />
                      <label class="form-check-label">
                        Добавление оборудования
                      </label>
                    </div>
                  </div>

                  <div class="col-md-4">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" />
                      <label class="form-check-label">
                        Удаление оборудования
                      </label>
                    </div>
                  </div>

                  <div class="col-md-4">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" checked />
                      <label class="form-check-label">
                        Использование Desktop Agent
                      </label>
                    </div>
                  </div>

                  <div class="col-md-4">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" />
                      <label class="form-check-label">
                        Управление пользователями
                      </label>
                    </div>
                  </div>

                  <div class="col-md-4">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" />
                      <label class="form-check-label"> Просмотр отчетов </label>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Примечание -->
              <div class="col-12 mb-3">
                <label class="form-label"> Примечание </label>

                <textarea class="form-control" rows="3"></textarea>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button type="reset" class="btn btn-secondary">Очистить</button>

              <button type="submit" class="btn btn-success">
                Выдать лицензию
              </button>
            </div>
          </form>
        </div>
      </div>
      ```
    </div>
  </body>
</html>
