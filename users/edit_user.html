                <div class="card-header">
                    <h4 class="mb-0">Редактирование пользователя</h4>
                </div>

                <div class="card-body">

                    <form class="row g-3">

                        <!-- ФИО -->
                        <div class="col-md-6">
                            <label class="form-label">
                                ФИО
                            </label>

                            <input type="text" class="form-control" placeholder="Введите ФИО">
                        </div>

                        <!-- Логин -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Логин
                            </label>

                            <input type="text" class="form-control" placeholder="Введите логин">
                        </div>

                        <!-- Email -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Email
                            </label>

                            <input type="email" class="form-control" placeholder="Введите email">
                        </div>

                        <!-- Роль -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Роль
                            </label>

                            <select class="form-select">
                                <option selected disabled>
                                    Выберите роль
                                </option>

                                <option>root</option>
                                <option>admin</option>
                                <option>user</option>
                            </select>
                        </div>

                        <!-- Пароль -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Пароль
                            </label>

                            <input type="password" class="form-control" placeholder="Введите пароль">
                        </div>

                        <!-- Повторить пароль -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Повторить пароль
                            </label>

                            <input type="password" class="form-control" placeholder="Повторите пароль">
                        </div>

                        <!-- Кнопка -->
                        <div class="col-12">

                            </button>
                        </div>
